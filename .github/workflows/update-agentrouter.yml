
name: Update AgentRouter Check-in

on:
  workflow_dispatch:
  schedule:
    # 每日 02:17 UTC 執行
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-agentrouter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and patch upstream script
        run: python scripts/patch_agentrouter.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check Loon/plugin/agentrouter_checkin.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit updated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Loon/plugin/agentrouter_checkin.js

          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi

          git commit -m "Update AgentRouter check-in script"
          git push
